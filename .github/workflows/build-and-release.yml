name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v1.1.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - name: Verify backend (syntax + boot + smoke)
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          ZCGW_TEST_CHROMIUM_PATH: /usr/bin/google-chrome
        run: bash scripts/ci-backend.sh

  image:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - name: Resolve image tags
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/check-version.mjs
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          tags=$(printf '%s' "$image:$RELEASE_TAG")
          # 预发布（版本号带 -）不打 latest
          if [ "${version#*-}" = "$version" ]; then
            tags=$(printf '%s\n%s' "$tags" "$image:latest")
          fi
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Verify slim published runtime
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ inputs.tag || github.ref_name }}
        run: bash scripts/ci-image.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=$(printf '%s\n' \
            "Docker image: \`docker pull ${{ steps.meta.outputs.image }}:$RELEASE_TAG\`" \
            '' \
            'Deploy: sync docker-compose.yml and run docker compose up -d. Watchtower checks latest every 10 minutes.' \
            'Existing deployments: retain custom ports, environment and data mounts when syncing Compose; pulling the app image alone does not install Watchtower.' \
            'Slim image: Chromium is no longer bundled. Automatic claims use an open logged-in panel browser; set ZCGW_BROWSER_CDP_URL for an existing external browser if unattended claims are required.' \
            'Source build: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build.' \
            'data/ 目录保存全部账号与配置，升级镜像不影响数据。')
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "zcgw $RELEASE_TAG" --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" docker-compose.yml docker-compose.build.yml --clobber
