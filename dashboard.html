<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f8f9fb" />
<title>zcgw · 账号池控制台</title>
<style>
/* ═══════ 设计令牌（对齐 cnb2api console）═══════ */
:root {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  font-synthesis: none;
  color-scheme: light;
  --bg: #f8f9fb; --surface: #fff; --surface-subtle: #fafbfd; --sidebar: #f2f4f7;
  --nav-active-bg: #cfddf2; --nav-active-border: #9fb5d6;
  --text: #232b3a; --muted: #7d8798; --secondary: #596477;
  --line: #e9edf2; --line-strong: #dce2eb;
  --primary: #3169df; --primary-hover: #2459ca; --primary-soft: #edf3ff;
  --green: #209d77; --green-soft: #edf9f3; --amber: #b88125; --amber-soft: #fff8eb;
  --red: #d35454; --red-soft: #fff2f2; --violet: #8a71c9; --violet-soft: #f4f0fc;
  --shadow: 0 2px 3px #1c315003, 0 1px 2px #1c315003;
  --radius: 12px; --radius-sm: 8px; --radius-lg: 16px; --radius-full: 999px;
  font-size: 14px; font-weight: 450;
  background: var(--bg); color: var(--text);
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #14181f; --surface: #1b2029; --surface-subtle: #1e242e; --sidebar: #14181f;
  --nav-active-bg: #b8cceb; --nav-active-border: #829dc6;
  --text: #e1e7f0; --muted: #8590a1; --secondary: #abb5c5;
  --line: #2a313e; --line-strong: #3b4455;
  --primary: #78a2ff; --primary-hover: #97b7ff; --primary-soft: #263653;
  --green: #68c5a4; --green-soft: #233c34; --amber: #dbb16d; --amber-soft: #3a3224;
  --red: #f58b8b; --red-soft: #3e2a2e; --violet: #b9a2f1; --violet-soft: #352d47;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 340px; }
button, input, select, textarea { font: inherit; outline-offset: 3px; }
button { cursor: pointer; color: inherit; font-weight: 500; background: none; border: none; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; opacity: .45; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
svg { flex-shrink: 0; vertical-align: middle; }
.mono, code, pre, .num { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
.muted { color: var(--muted); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
body.privacy .acc-ident, body.privacy .acc-subname, body.privacy td .ident-text { filter: blur(0); }

/* ═══════ 通用组件 ═══════ */
.button, .btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); padding: 7px 13px; font-size: 13.5px;
  transition: background .12s, border-color .12s;
}
.button:hover, .btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-brand, .button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-brand:hover, .button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
.btn-danger { color: var(--red); }
.btn-danger:hover { border-color: var(--red); }
.btn-sm { padding: 4px 10px; font-size: 12.5px; }
.icon-button {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--radius-sm); color: var(--secondary);
}
.icon-button:hover { background: var(--primary-soft); color: var(--primary); }
.text-link { color: var(--primary); font-size: inherit; padding: 0; }
.text-link:hover { text-decoration: underline; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
  border-radius: var(--radius-full); font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.badge-ok { background: var(--green-soft); color: var(--green); }
.badge-warn { background: var(--amber-soft); color: var(--amber); }
.badge-bad, .badge-off { background: var(--red-soft); color: var(--red); }
.badge-cn { background: var(--violet-soft); color: var(--violet); }
.badge-intl { background: var(--primary-soft); color: var(--primary); }
.badge-unknown { background: var(--surface-subtle); color: var(--muted); border: 1px solid var(--line); }
.badge-promo { background: var(--amber-soft); color: var(--amber); }
.badge-daily { background: var(--green-soft); color: var(--green); }
.badge-paid { background: var(--primary-soft); color: var(--primary); }
.badge-offpeak { background: var(--violet-soft); color: var(--violet); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.input, input[type="text"], input[type="password"], input[type="number"], input[type="search"], select {
  width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); padding: 7px 11px; font-size: 13.5px;
}
input:focus, select:focus { border-color: var(--primary); }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--secondary); margin: 12px 0 4px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.codebox { background: var(--surface-subtle); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; }
.link-btn { color: var(--primary); font-size: inherit; padding: 0; }
.link-btn:hover { text-decoration: underline; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; flex-shrink: 0; }
.status-dot.warn { background: var(--amber); }
.status-dot.bad { background: var(--red); }
.status-dot.off { background: var(--muted); }

/* 开关（启用/停用） */
.switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; border-radius: var(--radius-full);
  background: var(--line-strong); transition: background .15s;
}
.switch .slider::before {
  content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%;
  background: #fff; top: 3px; left: 3px; transition: transform .15s; box-shadow: 0 1px 2px #0003;
}
.switch input:checked + .slider { background: var(--green); }
.switch input:checked + .slider::before { transform: translateX(16px); }
.switch input:focus-visible + .slider { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ═══════ 启动屏 / 登录页 ═══════ */
.boot-screen { display: flex; gap: 10px; align-items: center; justify-content: center; min-height: 100vh; color: var(--muted); font-size: 14px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; }
.brand-icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: #fff; }
.brand-tag { font-size: 10px; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
.login-shell { display: grid; grid-template-columns: 1.1fr 1fr; min-height: 100vh; }
.login-story { background: var(--sidebar); padding: 44px 48px; display: flex; flex-direction: column; gap: 36px; border-right: 1px solid var(--line); }
.login-story-content { display: flex; flex-direction: column; gap: 18px; max-width: 460px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .14em; font-weight: 700; color: var(--secondary); }
.blue-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); display: inline-block; }
.login-story h1 { font-size: 30px; line-height: 1.35; font-weight: 650; }
.network-art { position: relative; margin-top: 8px; }
.network-center { display: inline-flex; align-items: center; gap: 9px; border: 1.5px solid var(--primary); color: var(--primary); border-radius: var(--radius-full); padding: 9px 18px; font-weight: 700; background: var(--surface); }
.network-art svg { width: 100%; height: 120px; stroke: var(--nav-active-border); fill: none; stroke-width: 1.5; }
.network-node {
  position: absolute; display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-full);
  padding: 6px 13px; font-size: 12px; color: var(--secondary);
}
.network-node i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.node-1 { top: -8px; right: 4%; } .node-2 { top: 52px; right: 22%; } .node-3 { bottom: -6px; right: 8%; }
.login-story-footer { margin-top: auto; color: var(--muted); font-size: 13px; }
.login-main { display: flex; align-items: center; justify-content: center; padding: 32px; position: relative; }
.login-theme { position: absolute; top: 22px; right: 22px; }
.login-form { width: 100%; max-width: 360px; display: flex; flex-direction: column; }
.login-form h2 { font-size: 22px; font-weight: 650; margin: 10px 0 4px; }
.login-form > p { color: var(--muted); font-size: 13.5px; }
.login-lock { color: var(--primary); margin-bottom: 4px; }
.form-error { color: var(--red); font-size: 13px; }
.login-submit { margin-top: 18px; }
.login-divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 16px 0 0; }
.login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.login-sso { margin-top: 16px; }

/* ═══════ 应用壳：顶栏 + 侧栏 + 主区 ═══════ */
.app-shell { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 54px 1fr; min-height: 100vh; }
.topbar {
  grid-column: 1 / 3; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 16px; position: sticky; top: 0; z-index: 30;
}
.topbar-leading { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mobile-toggle { display: none; }
.breadcrumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; }
.breadcrumbs strong { color: var(--text); font-weight: 650; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.topbar-separator { width: 1px; height: 20px; background: var(--line); }
.user-menu { position: relative; }
.user-trigger { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: var(--radius-full); }
.user-trigger:hover { background: var(--primary-soft); }
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
}
.user-avatar.large { width: 38px; height: 38px; font-size: 16px; }
.user-panel {
  position: absolute; right: 0; top: 44px; width: 230px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px #1c315018; padding: 8px; z-index: 60;
}
.user-identity { display: flex; gap: 10px; align-items: center; padding: 8px; }
.user-identity-text { display: flex; flex-direction: column; min-width: 0; }
.user-identity-text small { color: var(--muted); font-size: 12px; }
.user-menu-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.user-logout { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; border-radius: var(--radius-sm); color: var(--red); }
.user-logout:hover { background: var(--red-soft); }
.user-menu-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px; border-radius: var(--radius-sm); font-size: 13px; }
.user-menu-item:hover { background: var(--surface-subtle); }

.sidebar {
  background: var(--sidebar); border-right: 1px solid var(--line); padding: 14px 10px;
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto; position: sticky; top: 54px; height: calc(100vh - 54px);
  width: 216px; transition: width .15s;
}
.app-shell.sidebar-collapsed .sidebar { width: 60px; }
.app-shell.sidebar-collapsed .sidebar span, .app-shell.sidebar-collapsed .sidebar small,
.app-shell.sidebar-collapsed .nav-caption, .app-shell.sidebar-collapsed .sidebar-help span { display: none; }
.nav-caption { font-size: 10.5px; letter-spacing: .14em; color: var(--muted); font-weight: 700; padding: 12px 10px 5px; display: flex; justify-content: space-between; }
.nav-caption span { letter-spacing: .1em; }
.main-nav { display: flex; flex-direction: column; gap: 2px; }
.main-nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--secondary); font-size: 13.5px; border-left: 3px solid transparent; white-space: nowrap;
}
.main-nav a:hover { background: var(--primary-soft); color: var(--primary); }
.main-nav a.active { background: var(--nav-active-bg); border-left-color: var(--nav-active-border); color: var(--text); font-weight: 600; }
.main-nav a small { margin-left: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-full); font-size: 11px; padding: 0 7px; color: var(--muted); }
.sidebar-bottom { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
.sidebar-help { display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: var(--muted); font-size: 13px; border-radius: var(--radius-sm); }
.sidebar-help:hover { color: var(--primary); background: var(--primary-soft); }
.mobile-backdrop { display: none; }

.main-shell { display: flex; flex-direction: column; min-width: 0; }
.main-content { flex: 1; padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; max-width: 1280px; width: 100%; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 21px; font-weight: 650; }
.page-head p { color: var(--muted); font-size: 13px; margin-top: 3px; }
.page-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  border-top: 1px solid var(--line); padding: 10px 26px; color: var(--muted); font-size: 12px; background: var(--surface);
}
.page-footer .footer-left { display: inline-flex; align-items: center; gap: 8px; }
.page-footer button { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.page-footer button:hover { color: var(--primary); }
.error-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--red-soft); color: var(--red); border: 1px solid var(--red); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; }
.error-banner button { color: inherit; text-decoration: underline; font-size: 13px; }
.page-loading { display: flex; gap: 10px; align-items: center; justify-content: center; color: var(--muted); padding: 60px 0; }

/* ═══════ 概览 ═══════ */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .kpi-value { font-size: 25px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
.kpi .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi .kpi-sub.ok { color: var(--green); } .kpi .kpi-sub.warn { color: var(--amber); } .kpi .kpi-sub.bad { color: var(--red); }
.section-card { padding: 16px 18px; }
.section-card h2 { font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.section-card .section-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.chart { display: flex; align-items: flex-end; gap: 3px; height: 150px; margin-top: 14px; }
.chart .col { flex: 1; display: flex; align-items: flex-end; height: 100%; border-radius: 3px 3px 0 0; background: transparent; }
.chart .col i { display: block; width: 100%; background: var(--primary); border-radius: 3px 3px 0 0; opacity: .85; }
.chart .col.has-fail i { background: var(--red); }
.chart-x { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-top: 6px; }
.chart-empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 13px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th.num, table.data td.num { text-align: right; }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr:last-child td { border-bottom: none; }
.table-wrap { overflow-x: auto; }

/* ═══════ 账号页 ═══════ */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .spacer { flex: 1; }
.search-box { position: relative; display: inline-flex; align-items: center; }
.search-box svg { position: absolute; left: 10px; color: var(--muted); }
.search-box input { padding-left: 32px; width: 230px; }
.pill-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.group-pill {
  border: 1px solid var(--line-strong); border-radius: var(--radius-full); padding: 5px 14px;
  font-size: 12.5px; color: var(--secondary); background: var(--surface);
}
.group-pill[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.acc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.acc-card { padding: 15px 16px; display: flex; flex-direction: column; gap: 10px; }
.acc-card.off { opacity: .62; }
.acc-top { display: flex; align-items: flex-start; gap: 10px; }
.acc-id-wrap { display: flex; gap: 9px; align-items: flex-start; min-width: 0; flex: 1; }
.acc-ident { font-weight: 650; font-size: 14px; word-break: break-all; }
.acc-ident-btn { display: inline-flex; gap: 6px; align-items: center; color: var(--amber); font-size: 13px; font-weight: 600; }
.acc-subname { color: var(--muted); font-size: 12px; margin-top: 2px; }
.acc-badges { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
.acc-top .switch { margin-top: 2px; }
.quota-box { display: flex; flex-direction: column; gap: 9px; }
.q-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12.5px; }
.q-left { display: flex; gap: 6px; align-items: center; min-width: 0; }
.bar { height: 6px; border-radius: var(--radius-full); background: var(--surface-subtle); border: 1px solid var(--line); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: inherit; }
.bar.brand i { background: var(--amber); } .bar.daily i { background: var(--violet); }
.plan-strip { display: flex; gap: 6px; flex-wrap: wrap; }
.plan-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--secondary); background: var(--surface-subtle); border: 1px solid var(--line); border-radius: var(--radius-full); padding: 2px 9px; }
.plan-tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.ident-hint { display: flex; gap: 7px; background: var(--amber-soft); color: var(--amber); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12px; align-items: flex-start; }
.acc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.acc-meta { color: var(--muted); font-size: 12px; }
.acc-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.empty-state { text-align: center; color: var(--muted); padding: 46px 0; font-size: 13.5px; }
.onboard-card { background: var(--surface); border: 1.5px solid var(--primary); border-radius: var(--radius); padding: 16px 18px; }
.ob-state { display: flex; align-items: center; gap: 8px; color: var(--secondary); font-size: 12.5px; }

/* ═══════ 弹窗 / Toast ═══════ */
.modal-bg {
  position: fixed; inset: 0; background: #10162366; backdrop-filter: blur(2px);
  display: flex; align-items: flex-start; justify-content: center; padding: 7vh 16px 16px; z-index: 100; overflow-y: auto;
}
.modal {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: 0 18px 48px #10162333; width: 100%; max-width: 480px; padding: 22px 24px;
}
.modal.wide { max-width: 640px; }
.modal h3 { font-size: 17px; font-weight: 650; }
.modal > p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.toast-stack { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 9px; z-index: 200; max-width: 380px; }
.toast {
  display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--green); border-radius: var(--radius); box-shadow: 0 10px 30px #1c31501c; padding: 11px 13px;
  font-size: 13px; transition: opacity .3s;
}
.toast.warn { border-left-color: var(--amber); } .toast.warn .toast-ico { color: var(--amber); }

function maskIdentity(s) {
  const str = String(s || '');
  if (!privacyOn || !str) return str;
  if (str.includes('@')) {
    const [local, domain] = str.split('@');
    return `${local.slice(0, 1)}${'•'.repeat(Math.max(2, Math.min(5, local.length - 1)))}@${domain || '***'}`;
  }
  if (/^1\d{10}$/.test(str)) return str.slice(0, 3) + '****' + str.slice(-4);
  if (/^\d{3}\*{4}\d{4}$/.test(str)) return str;
  return str.slice(0, 1) + '•••';
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const text = await r.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { throw new Error(`服务端响应异常（HTTP ${r.status}）`); }
  if (!r.ok) {
    const err = new Error(data.error || `请求失败（HTTP ${r.status}）`);
    err.status = r.status; err.code = data.code;
    if (r.status === 401 && data.code === 'panel_auth' && !$('#login-key')) showLogin();
    throw err;
  }
  return data;
}
const postJson = (path, body) => api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) });

function toast(kind, title, body) {
  const el = document.createElement('div');

  el.innerHTML = `<span class="toast-ico">${ico(kind === 'ok' ? 'check' : 'alert', 17)}</span>
    <div style="min-width:0"><div class="t-title"></div>${body ? '<div class="t-body"></div>' : ''}</div>
    <button class="icon-button" style="width:24px;height:24px" aria-label="关闭">${ico('x', 13)}</button>`;
  el.querySelector('.t-title').textContent = title;
  if (body) el.querySelector('.t-body').textContent = body;
  el.querySelector('button').onclick = () => el.remove();
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; }, kind === 'err' ? 7000 : 4200);
  setTimeout(() => el.remove(), kind === 'err' ? 7400 : 4600);
}

}

  else if (state.page === 'logs') loadPage('logs').catch(() => {});
}
function navigate(id) {
  if (!NAV.some((n) => n.id === id)) id = 'overview';
  state.page = id;
  $$('#sidebar a[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === id));
  const crumb = $('#crumb'); if (crumb) crumb.textContent = NAV.find((n) => n.id === id).label;
  if (location.hash !== `#${id}`) history.replaceState(null, '', `#${id}`);
  const main = $('#main-content');
  if (main) main.scrollTo({ top: 0 });
  loadPage(id).catch((e) => { if (e.code !== 'panel_auth') toast('err', '加载失败', e.message); });
}
window.addEventListener('hashchange', () => {
  if (state.authed || !state.authRequired) navigate((location.hash || '#overview').slice(1));
});

async function loadPage(id, manual) {
  if (id === 'overview') await loadOverview();
  else if (id === 'accounts') await loadAccounts();
  else if (id === 'keys') await loadKeys();
  else if (id === 'gateway') await loadGateway();
  else if (id === 'logs') await loadLogs();
  else if (id === 'security') await loadSecurity();
  else if (id === 'access') renderAccess();
  if (manual) toast('ok', '已刷新');
}
function touchSync() {
  state.lastUpdated = new Date();
  const el = $('#footer-sync');
  if (el) el.textContent = `每15秒刷新 · ${state.lastUpdated.toLocaleTimeString('zh-CN', { hour12: false })}`;
}
function updateNavCounts() {
  const a = $('#nav-cnt-acc'); if (a) a.textContent = state.pool.length;
  const k = $('#nav-cnt-key'); if (k) k.textContent = state.keys.length;
  const g = $('#footer-gw');
  if (g) g.textContent = `GLM 账号池 · 调度 topN=${state.settings?.topN ?? '—'} · 粘性 ${state.settings?.stickyTtlMin ?? '—'}min`;

/* ════════ 数据加载 ════════ */
async function loadPoolAndKeys() {
  const jobs = [api('/pool'), api('/quota')];
  if (!state.keys.length) jobs.push(api('/keys').catch(() => null));
  const [pool, quota, keys] = await Promise.all(jobs);
  state.pool = pool.accounts ?? [];
  state.stickySessions = pool.stickySessions ?? 0;
  state.quota = quota.accounts ?? [];
  if (keys) state.keys = keys.keys ?? [];
  updateNavCounts();
}
function accountState(a) {
  if (a.disabled) return { key: 'disabled', label: '已停用', cls: 'off dot-off' };
  if (a.cooling) return { key: 'cooling', label: `冷却中 · ${a.cooldownMin} 分钟`, cls: 'warn' };
  if (a.degraded) return { key: 'degraded', label: '降级中', cls: 'warn' };
  return { key: 'healthy', label: `可用 · 在途 ${a.inFlight || 0}`, cls: '' };
}

/* ── 运行概览 ── */
async function loadOverview() {
  const [pool, quota, keys, today, d14] = await Promise.all([
    api('/pool'), api('/quota'),
    api('/keys').catch(() => ({ keys: [] })),
    api('/stats?range=today').catch(() => null),
    api('/stats?range=14d').catch(() => null),
  ]);
  state.pool = pool.accounts ?? [];
  state.stickySessions = pool.stickySessions ?? 0;
  state.quota = quota.accounts ?? [];
  state.keys = keys.keys ?? [];
  state.statsToday = today; state.stats14d = d14;
  updateNavCounts();
  renderOverview();
  touchSync();
}
function kpiCard(label, value, sub, cls) {
  return `<div class="card kpi"><div class="kpi-label">${esc(label)}</div><div class="kpi-value">${value}</div><div class="kpi-sub ${cls || ''}">${sub}</div></div>`;
}
function chartHtml(j) {
  if (!j || !j.buckets) return '<div class="chart-empty">统计加载失败或区间内没有调用记录</div>';
  const maxTok = Math.max(1, ...j.buckets.map((b) => b.tokens));
  const has = j.buckets.some((b) => b.requests);
  if (!has) return '<div class="chart-empty">区间内没有调用记录</div>';
  const label = (b) => `${j.range === 'today' ? new Date(b.t).getHours() + ':00' : fmtDay(b.t)} · ${b.requests} 请求 · ${fmt(b.tokens)} tokens`;
  return `<div class="chart">${j.buckets.map((b) => `<div class="col ${b.fails ? 'has-fail' : ''}" title="${esc(label(b))}"><i style="height:${b.tokens ? Math.max(3, Math.round((b.tokens / maxTok) * 100)) : 0}%"></i></div>`).join('')}</div>
    <div class="chart-x"><span>${j.range === 'today' ? '00:00' : fmtDay(j.buckets[0]?.t)}</span><span>${j.range === 'today' ? '12:00' : ''}</span><span>${j.range === 'today' ? '23:00' : fmtDay(j.buckets[j.buckets.length - 1]?.t)}</span></div>`;
}
function renderOverview() {
  const pool = state.pool;
  const avail = pool.filter((a) => !a.disabled && !a.cooling && !a.degraded).length;
  const cooling = pool.filter((a) => a.cooling || a.degraded).length;
  const disabled = pool.filter((a) => a.disabled).length;
  const cn = pool.filter((a) => a.realm === 'cn').length;
  const intl = pool.filter((a) => a.realm === 'intl').length;
  const nowSec = Date.now() / 1000;
  let expiring = 0;
  for (const q of state.quota) for (const p of q.plans ?? []) if (p.status === 'active' && p.endsAt && p.endsAt > nowSec && p.endsAt - nowSec < 3 * 86400) expiring++;

  const t = state.statsToday?.totals;
  const usageRow = t ? [
    kpiCard('今日请求', fmt(t.requests), `成功 ${fmt(t.ok)} · 失败 ${fmt(t.fail)}`, t.fail ? 'warn' : 'ok'),
    kpiCard('今日 tokens', fmtCompact(t.tokens), `入 ${fmtCompact(t.in)} · 出 ${fmtCompact(t.out)}`),
    kpiCard('缓存命中', `${t.cacheHitRate}%`, `读 ${fmtCompact(t.cacheRead)} · 写 ${fmtCompact(t.cacheCreate)}`),
    kpiCard('平均延迟', t.avgMs ? `${t.avgMs} ms` : '—', `共 ${fmt(t.requests)} 次请求`),
  ] : ['<div class="card kpi muted" style="text-align:center">统计加载中…</div>', '', '', ''];

  const recent = state.statsToday?.recent ?? [];
  $('#main-content').innerHTML = `
    <div class="page-head"><div><h1>运行概览</h1><p>${esc(PAGE_SUB.overview)}</p></div>
      <div class="toolbar">
        <button class="button" id="btn-go-claim">${ico('zap', 15)}<span>一键领取</span></button>
        <button class="button primary" id="btn-go-onboard">${ico('plus', 15)}<span>登录新账号</span></button>
      </div></div>
    <div class="kpi-grid">
      ${kpiCard('账号总数', pool.length, `国内 ${cn} · 国际 ${intl} · 其他 ${pool.length - cn - intl}`)}
      ${kpiCard('当前可用', avail, cooling ? `${cooling} 个冷却/降级` : '全部正常', cooling ? 'warn' : 'ok')}
      ${kpiCard('手动停用', disabled, disabled ? '面板可重新启用' : '无', disabled ? 'bad' : '')}
      ${kpiCard('临近到期', expiring, expiring ? '3 天内到期的套餐' : '暂无风险', expiring ? 'warn' : '')}
    </div>
    <div class="kpi-grid">${usageRow[0]}${usageRow[1]}${usageRow[2]}${usageRow[3]}</div>
    <div class="card section-card"><h2>${ico('dashboard', 16)}近 14 天调用量</h2><div class="section-sub">按天聚合 · 红柱表示该时段有失败</div>${chartHtml(state.stats14d)}</div>
    <div class="card section-card"><h2>${ico('scroll', 16)}近期请求</h2>
      <div class="table-wrap"><table class="data"><thead><tr><th>时间</th><th>密钥</th><th>来源 IP</th><th>账号</th><th>模型</th><th class="num">入 / 出 / 缓存读</th><th class="num">耗时</th><th>结果</th></tr></thead>
      <tbody id="ov-recent">${recentRows(recent)}</tbody></table></div></div>`;
  $('#btn-go-onboard').onclick = () => openOnboard();
  $('#btn-go-claim').onclick = claimAll;
}
function recentRows(rows) {
  if (!rows.length) return '<tr><td colspan="8" class="muted" style="text-align:center;padding:22px">还没有请求记录</td></tr>';
  return rows.map((r) => `<tr>
    <td class="num muted">${fmtDate(r.t)}</td><td>${esc(r.key)}</td><td class="num muted">${esc(r.ip || '—')}</td>
    <td>${esc(maskIdentity(r.acc))}</td><td>${esc(r.model)}</td>
    <td class="num">${fmt(r.in)} / ${fmt(r.out)} / ${fmt(r.cacheRead)}</td><td class="num">${r.ms} ms</td>
    <td>${r.ok ? '<span class="badge badge-ok">成功</span>' : `<span class="badge badge-bad">${esc(r.err || '失败')}</span>`}</td></tr>`).join('');
}

async function startOnboard(provider, bg) {
  obDone = false;
  if (obTimer) clearInterval(obTimer);
  const box = bg.querySelector('#ob-flow');
  box.innerHTML = `<div class="ob-state"><span class="spin" style="color:var(--primary)">${ico('loader', 15)}</span><span>正在创建 ZCode 授权链接（${provider === 'bigmodel' ? '国内 bigmodel' : '国际 z.ai'}）…</span></div>`;
  let flow;
  try { flow = await postJson('/onboard/start', { provider }); }
  catch (e) { toast('err', '无法发起登录授权', e.message); box.innerHTML = ''; return; }
  obFlow = flow;
  const expireAt = new Date(flow.expiresAt * 1000).toLocaleTimeString('zh-CN', { hour12: false });
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <b style="font-size:14px">第一步：在浏览器完成 ZCode 登录授权</b>

    </div>
    <p class="muted" style="font-size:12.5px;margin-bottom:10px">授权通过后面板会自动纳管、自动领取，并识别手机号/邮箱与归属。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button type="button" class="button primary" id="ob-open">${ico('external', 15)}<span>打开 ZCode 授权页</span></button>
      <button type="button" class="button" id="ob-poll">我已授权，立即检查</button>
      <span class="ob-state" id="ob-state">自动等待授权结果…</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px">
      <input type="text" id="ob-paste" class="input" style="flex:1;min-width:220px" placeholder="自动等待一直失败时：粘贴授权完成后浏览器地址栏的完整链接">
      <button type="button" class="button" id="ob-redeem">提交链接</button>
    </div>`;
  box.querySelector('#ob-open').onclick = () => window.open(flow.authorizeUrl, '_blank');
  box.querySelector('#ob-poll').onclick = () => obPollOnce(bg);
  box.querySelector('#ob-redeem').onclick = async () => {
    const st = box.querySelector('#ob-state');
    const url = (box.querySelector('#ob-paste').value || '').trim();
    if (!url) { st.textContent = '请先粘贴授权完成后浏览器地址栏的链接'; return; }
    try {
      const r = await postJson('/onboard/redeem', { flowId: flow.flowId, url });
      if (r.status === 'ready') { obStop(); showOnboardSuccess(r, false); return; }
      if (r.status === 'pending') { st.textContent = '提交了但还没生效：确认浏览器已走到授权最后一步；若 code 已被浏览器消费过，稍等自动轮询即可'; return; }
      st.textContent = `当前状态：${r.status}`;
    } catch (e) {
      if (e.status === 410) { obStop(); st.textContent = '授权流程已过期或已失效，请重新发起登录'; return; }
      st.textContent = '提交失败：' + e.message;
    }
  };
  const st = box.querySelector('#ob-state');
  obTimer = setInterval(async () => {
    if (obDone || !document.body.contains(box)) { obStop(); return; }
    await obPollOnce(bg);
  }, Math.max(2, flow.pollIntervalSec || 2) * 1000);
}
function obStop() { obDone = true; if (obTimer) clearInterval(obTimer); }
async function obPollOnce(bg) {
  if (obDone || !obFlow) return;
  const st = bg.querySelector('#ob-state');
  if (!st) return;
  try {
    const r = await api(`/onboard/poll/${encodeURIComponent(obFlow.flowId)}`);
    if (r.status === 'pending') { st.textContent = '等待你在浏览器点击确认授权…'; return; }
    if (r.status !== 'ready') { st.textContent = `当前状态：${r.status}`; return; }
    obStop();
    showOnboardSuccess(r, false);
  } catch (e) {
    if (e.status === 410) { obStop(); st.textContent = '授权流程已过期或已失效，请重新发起登录'; return; }
    st.textContent = '等待重连：' + e.message;
  }
}
function showOnboardSuccess(r, fromPaste) {
  const m = $('.modal-bg'); if (m) m.remove();
  const c = r.claim || {};
  let desc = '已尝试自动领取';
  if (c.ok && c.alreadyClaimed) desc = c.expired ? '注册礼包已领过（新号专属）' : '额度已在生效中';
  else if (c.ok) desc = `已成功领取 ${c.claimed}`;
  else if (c.msg) desc = c.msg;
  const who = r.identity || r.label;
  toast('ok', fromPaste ? `已添加 ${who}` : `登录成功：${who}`, desc);
  loadAccounts().then(() => {
    if (!r.identity || r.realm === 'unknown') {
      const acc = state.pool.find((a) => a.label === r.label);
      if (acc && !acc.hasAccessToken) openIdentityEditor(acc);
    }
  }).catch(() => {});
}
async function redeemPasteUrl() {
  const inp = $('#inp-onboard-url');
  const url = (inp?.value || '').trim();
  if (!url) { toast('err', '请先粘贴授权完成后的链接', '浏览器授权后最后跳到的地址，里面带 code= 和 state='); return; }
  const btn = $('#btn-onboard-url');
  btn.disabled = true;
  try {
    const r = await postJson('/onboard/redeem', { url });
    if (r.status === 'ready') { inp.value = ''; showOnboardSuccess(r, true); return; }
    if (r.status === 'pending') { toast('warn', '链接已提交但还未生效', '确认浏览器已走到授权最后一步；若是旧链接请重新发起登录授权一次'); return; }
    toast('warn', `当前状态：${r.status}`);
  } catch (e) {
    if (e.status === 410) toast('err', '授权流程不存在或已过期', e.message);
    else toast('err', '提交失败', e.message);
  } finally { btn.disabled = false; }
}

        numField('idleWeightPerHour', '闲置补偿 / 小时', '闲置每小时额外加的权重', '0.1'),
        numField('idleWeightMax', '闲置补偿封顶', '闲置补偿上限；0 = 关闭闲置补偿'),
        numField('topN', 'Top-N 候选窗口', '只从权重最高的 N 个号里加权随机'),
      ])}
      ${group('会话粘性', [numField('stickyTtlMin', '粘性 TTL', '同一会话固定同号的时长（滚动续期）', '分钟')])}
      ${group('冷却与熔断', [
        numField('busyCooldownSec', '限流首次冷却', '1005/3009 首次按并发瞬态处理', '秒'),
        numField('quotaCooldownMin', '额度冷却', '限流反复出现后的冷却', '分钟'),
        numField('blockedCooldownMin', '风控冷却', '3012 被拦时的冷却', '分钟'),
        numField('breakerCooldownMin', '熔断基数', '连败熔断起始时长（之后翻倍封顶 6h）', '分钟'),
        numField('breakerThreshold', '熔断阈值', '连续失败几次触发熔断', '次'),
      ])}
      ${group('并发与节奏', [
        numField('maxInFlight', '单号在途上限', '同一账号同时处理的请求数'),
        numField('minPickGapMs', '防惊群窗口', '这段时间内刚被选过的号排到队尾', 'ms'),
      ])}
    </div>
    <div class="card section-card"><h2>${ico('power', 16)}运维操作</h2>
      <div class="toolbar" style="margin-top:10px">
        <button class="button" id="btn-reset2">${ico('refresh', 14)}<span>解除全部账号冷却</span></button>
      </div>
      <div class="hint" style="margin-top:6px">账号的启用/停用在「账号管理」页的卡片开关里操作。</div>
    </div>`;
  $('#ps-save').onclick = async () => {
    const body = {};
    for (const k of Object.keys(L)) { const el = $(`#ps-${k}`); if (el && el.value !== '') body[k] = Number(el.value); }
    try {
      const r = await postJson('/pool/settings', body);
      const n = Object.keys(r.applied || {}).length;
      toast('ok', '轮换设置已生效', `更新 ${n} 项，已持久化`);
      await loadGateway();
    } catch (e) { toast('err', '保存失败', e.message); }
  };
  const fillDefaults = () => {
    const defaults = {
      maxInFlight: 5, breakerThreshold: 3, breakerCooldownMin: 30, blockedCooldownMin: 10,
      quotaCooldownMin: 30, busyCooldownSec: 90, stickyTtlMin: 30, topN: 3,
      idleWeightPerHour: 0.5, idleWeightMax: 5, minPickGapMs: 120, weightBalFactor: 10, weightSuccFactor: 3,
    };
    for (const [k, v] of Object.entries(defaults)) { const el = $(`#ps-${k}`); if (el) el.value = v; }
    toast('ok', '已填入默认值', '点「保存并生效」后才会应用');
  };
  $('#ps-reset').onclick = fillDefaults;
  $('#btn-reset2').onclick = async () => {
    try { await postJson('/pool/reset'); toast('ok', '已解除全部账号冷却'); await loadGateway(); }
    catch (e) { toast('err', '操作失败', e.message); }
  };
}

/* ── 请求日志 ── */
async function loadLogs(manual) {
  const key = $('#lg-key')?.value.trim() || '', acc = $('#lg-acc')?.value.trim() || '', model = $('#lg-model')?.value.trim() || '';
  const j = await api(`/logs?limit=200&key=${encodeURIComponent(key)}&acc=${encodeURIComponent(acc)}&model=${encodeURIComponent(model)}`);
  state.logs = j.logs ?? [];
  if (!$('#main-content')?.querySelector('#lg-key')) renderLogsShell(j.total);
  $('#lg-total').textContent = fmt(j.total);
  $('#lg-rows').innerHTML = state.logs.length
    ? state.logs.map((r) => `<tr>
        <td class="num muted">${fmtDate(r.t)}</td><td>${esc(r.key)}</td><td class="num muted">${esc(r.ip || '—')}</td>
        <td>${esc(maskIdentity(r.acc))}</td><td>${esc(r.model)}</td>
        <td class="num">${fmt(r.in)}</td><td class="num">${fmt(r.out)}</td><td class="num">${fmt(r.cacheRead)}</td>
        <td class="num">${r.ms} ms</td>
        <td>${r.ok ? '<span class="badge badge-ok">成功</span>' : `<span class="badge badge-bad">${esc(r.err || '失败')}</span>`}</td></tr>`).join('')
    : '<tr><td colspan="10" class="muted" style="text-align:center;padding:22px">没有匹配的请求记录</td></tr>';
  if (manual) toast('ok', '日志已刷新');
  touchSync();
}
function renderLogsShell(total) {
  $('#main-content').innerHTML = `
    <div class="page-head"><div><h1>请求日志</h1><p>${esc(PAGE_SUB.logs)} · 命中 <b id="lg-total">${fmt(total)}</b> 条（最多回看 200 条）</p></div></div>
    <div class="card section-card"><div class="toolbar">
        <input id="lg-key" class="input" style="max-width:160px" placeholder="按密钥名过滤">
        <input id="lg-acc" class="input" style="max-width:160px" placeholder="按账号过滤">
        <input id="lg-model" class="input" style="max-width:160px" placeholder="按模型过滤">
        <button class="button primary" id="lg-go">${ico('refresh', 14)}<span>查询</span></button>
      </div>
      <div class="table-wrap" style="margin-top:12px"><table class="data">
        <thead><tr><th>时间</th><th>密钥</th><th>来源 IP</th><th>账号</th><th>模型</th><th class="num">入</th><th class="num">出</th><th class="num">缓存读</th><th class="num">耗时</th><th>结果</th></tr></thead>
        <tbody id="lg-rows"></tbody></table></div></div>`;
  const go = () => loadLogs().catch((e) => toast('err', '日志加载失败', e.message));
  $('#lg-go').onclick = go;
  ['lg-key', 'lg-acc', 'lg-model'].forEach((id) => { $(`#${id}`).onkeydown = (e) => { if (e.key === 'Enter') go(); }; });
}

/* ── 安全防护 ── */
async function loadSecurity(manual) {
  const j = await api('/security');
  state.security = j;
  $('#main-content').innerHTML = `
    <div class="page-head"><div><h1>安全防护</h1><p>${esc(PAGE_SUB.security)}</p></div>
      <button class="button" id="btn-sec-clear">${ico('x', 14)}<span>清空拦截日志</span></button></div>
    <div class="card section-card" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <div><h2>${ico('shield', 16)}IP 管控</h2>
        <div class="section-sub" id="sec-mode-sub"></div></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span id="sec-state"></span>
        <select id="sec-mode-sel" style="width:130px"><option value="blacklist">黑名单</option><option value="whitelist">白名单</option></select>
        <label class="switch"><input type="checkbox" id="sec-toggle" ${j.enabled ? 'checked' : ''}><span class="slider"></span></label>
      </div></div>
    <div class="card section-card"><h2>${ico('waypoints', 16)}规则 <span class="badge badge-unknown" id="sec-rules-count"></span></h2><div class="section-sub" id="sec-rules-sub"></div>
      <div class="toolbar" style="margin:10px 0">
        <select id="sec-new-type" style="max-width:110px"><option value="deny">拒绝</option><option value="allow">放行</option></select>
        <input id="sec-new-cidr" class="input" style="max-width:220px" placeholder="IP 或 CIDR，如 1.2.3.4/32">
        <input id="sec-new-note" class="input" style="max-width:200px" placeholder="备注（可选）">
        <button class="button primary" id="sec-add">${ico('plus', 14)}<span>添加规则</span></button>
      </div>
      <div class="table-wrap"><table class="data"><thead><tr><th>类型</th><th>网段</th><th>备注</th><th class="num">创建时间</th><th>操作</th></tr></thead>
        <tbody id="sec-rules"></tbody></table></div></div>
    <div class="card section-card"><h2>${ico('scroll', 16)}拦截记录 <span class="badge badge-bad">${fmt(j.blockedTotal)}</span></h2>
      <div class="table-wrap" style="margin-top:10px"><table class="data"><thead><tr><th>时间</th><th class="num">IP</th><th>路径</th><th>原因</th><th>User-Agent</th></tr></thead>
        <tbody id="sec-blocked"></tbody></table></div></div>`;
  $('#sec-mode-sub').textContent = j.enabled
    ? (j.mode === 'whitelist' ? '仅白名单内 IP 可访问' : '命中黑名单即拒绝')
    : '所有来源 IP 均放行';
  $('#sec-state').innerHTML = j.enabled ? '<span class="badge badge-ok">已启用</span>' : '<span class="badge badge-unknown">未启用</span>';
  $('#sec-mode-sel').value = j.mode || 'blacklist';
  $('#sec-rules-count').textContent = fmt(j.rules.length);
  $('#sec-rules-sub').textContent = `${j.rules.filter((r) => r.type === 'deny').length} 拒绝 / ${j.rules.filter((r) => r.type === 'allow').length} 放行`;
  $('#sec-rules').innerHTML = j.rules.length
    ? j.rules.map((r, i) => `<tr>
        <td><span class="badge ${r.type === 'deny' ? 'badge-bad' : 'badge-ok'}">${r.type === 'deny' ? '拒绝' : '放行'}</span></td>
        <td class="num">${esc(r.cidr)}</td><td>${esc(r.note || '—')}</td><td class="num muted">${fmtDate(r.createdAt)}</td>
        <td><button type="button" class="btn btn-sm btn-danger" data-del-rule="${i}">删除</button></td></tr>`).join('')
    : '<tr><td colspan="5" class="muted" style="text-align:center;padding:18px">暂无规则</td></tr>';
  $('#sec-blocked').innerHTML = j.blocked.length
    ? j.blocked.map((r) => `<tr>
        <td class="num muted">${fmtDate(r.t)}</td><td class="num">${esc(r.ip)}</td><td class="num muted">${esc(r.path)}</td>
        <td><span class="badge badge-bad">已拦截</span><div class="muted" style="font-size:12px">${esc(r.reason || '')}</div></td>
        <td class="truncate muted" style="max-width:220px" title="${esc(r.ua || '')}">${esc(r.ua || '—')}</td></tr>`).join('')
    : '<tr><td colspan="5" class="muted" style="text-align:center;padding:18px">暂无拦截记录</td></tr>';

  $('#sec-toggle').onchange = async () => {
    const next = $('#sec-toggle').checked;
    try {
      await postJson('/security', { enabled: next });
      await loadSecurity();
      toast(next ? 'ok' : 'warn', next ? 'IP 管控已启用' : 'IP 管控已关闭', next ? '不在规则内的 IP 将按模式处理' : '所有来源 IP 均放行');
    } catch (e) { toast('err', '操作失败', e.message); await loadSecurity(); }
  };
  $('#sec-mode-sel').onchange = async (e) => {
    try {
      await postJson('/security', { mode: e.target.value });
      await loadSecurity();
      toast('ok', '拦截模式已切换', e.target.value === 'whitelist' ? '白名单模式：仅命中放行规则的 IP 可访问' : '黑名单模式：仅命中拒绝规则的 IP 被拦截');
    } catch (e2) { toast('err', '操作失败', e2.message); }
  };
  $('#sec-add').onclick = async () => {
    const cidr = $('#sec-new-cidr').value.trim();
    if (!cidr) return toast('warn', '缺少 IP', '请填写 IP 或 CIDR 段');
    try {
      await postJson('/security', { action: 'add', type: $('#sec-new-type').value, cidr, note: $('#sec-new-note').value.trim() });
      $('#sec-new-cidr').value = ''; $('#sec-new-note').value = '';
      await loadSecurity();
      toast('ok', '规则已添加', cidr);
    } catch (e) { toast('err', '添加失败', e.message); }
  };
  $$('#main-content [data-del-rule]').forEach((b) => {
    b.onclick = async () => {
      try { await postJson('/security', { action: 'remove', index: Number(b.dataset.delRule) }); await loadSecurity(); }
      catch (e) { toast('err', '删除失败', e.message); }
    };
  });
  $('#btn-sec-clear').onclick = async () => {
    try { await postJson('/security/clear-blocked'); await loadSecurity(); toast('ok', '拦截日志已清空'); }
    catch (e) { toast('err', '操作失败', e.message); }
  };
  touchSync();
  if (manual) toast('ok', '安全面板已刷新');
}

/* ── 接入配置 ── */
async function renderAccess() {
  let models = [];
  try { const j = await api('/v1/models'); models = j.data ?? []; } catch {}
  const base = location.origin;
  $('#main-content').innerHTML = `
    <div class="page-head"><div><h1>接入配置</h1><p>${esc(PAGE_SUB.access)}</p></div></div>
    <div class="card section-card"><h2>${ico('braces', 16)}Base URL 与模型</h2>
      <div class="toolbar" style="margin-top:10px"><code class="codebox" style="flex:1;max-height:none">${esc(base)}</code><button class="button" id="acc-copy-base">${ico('copy', 14)}<span>复制</span></button></div>
      <div class="plan-strip" style="margin-top:10px">${models.map((m) => `<span class="plan-tag"><i></i><span>${esc(m.id)}</span></span>`).join('') || '<span class="muted">读取模型列表失败</span>'}</div>
      <div class="hint" style="margin-top:8px">Anthropic 协议：POST ${esc(base)}/v1/messages ｜ OpenAI 协议：POST ${esc(base)}/v1/chat/completions ｜ 模型列表：GET ${esc(base)}/v1/models</div></div>
    <div class="card section-card"><h2>${ico('key', 16)}鉴权</h2>
      <div class="hint" style="margin-top:8px">请求头带 <code>x-api-key</code>（Anthropic 风格）或 <code>authorization: Bearer</code>（OpenAI 风格），值为「API 密钥」页创建的 zck_ 开头的 key；未配任何 key 且未设 GATEWAY_KEY 时为开放模式。</div></div>
    <div class="card section-card"><h2>${ico('scroll', 16)}客户端示例</h2><pre class="codebox" style="margin-top:10px" id="acc-curl"></pre>
      <button class="button" id="acc-copy-curl" style="margin-top:10px">${ico('copy', 14)}<span>复制示例</span></button></div>
    <div class="card section-card"><h2>${ico('shield', 16)}面板与网关的口令</h2>
      <div class="hint" style="margin-top:8px">PANEL_KEY —— 面板登录口令（compose 环境变量设置后生效，当前${state.authRequired ? '已启用' : '未设置：面板免登录'})；GATEWAY_KEY —— 除面板密钥外的固定后门 key；两者的值都不要相同。</div></div>`;
  const sample = `# Anthropic 风格（Claude Code 兼容）
curl ${base}/v1/messages \\
  -H "x-api-key: zck_xxxxxxxx" \\
  -H "content-type: application/json" \\
  -d '{"model":"GLM-5.3-Flash","max_tokens":1024,"thinking":{"type":"enabled","budget_tokens":40960},"messages":[{"role":"user","content":"你好"}]}'

# OpenAI 风格
curl ${base}/v1/chat/completions \\
  -H "authorization: Bearer zck_xxxxxxxx" \\
  -H "content-type: application/json" \\
  -d '{"model":"GLM-5.3-Flash","reasoning_effort":"high","messages":[{"role":"user","content":"你好"}]}'`;
  $('#acc-curl').textContent = sample;
  $('#acc-copy-base').onclick = () => copyText(base);
  $('#acc-copy-curl').onclick = () => copyText(sample);
  touchSync();
}

/* ════════ 启动 ════════ */
async function enterApp() {
  await renderShell();
  const initial = (location.hash || '#overview').slice(1);
  navigate(NAV.some((n) => n.id === initial) ? initial : 'overview');
}
async function boot() {
  applyTheme(localStorage.getItem('zcgw_theme') || 'light');
  try {
    const st = await api('/panel/state');
    state.authRequired = !!st.authRequired;
    state.authed = !!st.authed;
  } catch { state.authRequired = false; state.authed = true; }
  if (state.authRequired && !state.authed) { renderLogin(); return; }
  await enterApp();
}
setInterval(() => {
  if (document.hidden || !state.authed) return;
  loadPage(state.page).catch(() => {});
}, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.authed) loadPage(state.page).catch(() => {}); });
boot();
</script>
