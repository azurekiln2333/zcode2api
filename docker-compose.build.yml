# 本地源码构建：不跟随远端镜像更新。
# docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  zcgw:
    image: zcgw:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  watchtower:
    profiles: [auto-update]
