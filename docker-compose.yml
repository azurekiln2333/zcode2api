# zcgw — ZCode 多账号反代网关
#
#   docker compose up -d          # 启动网关和 Watchtower（首次自动建目录）
#   docker compose logs -f        # 跟日志
#   docker compose down           # 停止（数据保留）
#   docker compose logs -f watchtower  # 查看自动更新日志
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build  # 源码构建
#
# 数据全部落在 ./data/（宿主机可备份/编辑）：
#   accounts.json  keys.json  usage.jsonl  pool-*.json  security.json  onboard-flows.json
#
# 首次部署：把 accounts.json / keys.json 等放到 ./data/ 再 up，或启动后用面板添加。

services:
  zcgw:
    image: "${ZCGW_IMAGE:-ghcr.io/azurekiln2333/zcode2api:latest}"
    container_name: zcgw
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-12283}:${PORT:-12283}"   # 只本机 nginx 反代；已有部署可在 .env 中设置 PORT=12283
    environment:
      # 监听容器内 0.0.0.0（必须，docker 端口映射依赖它）
      HOST: 0.0.0.0
      PORT: "${PORT:-12283}"
      # 可选：主密钥（面板密钥之外的后门 key）；一般留空用面板建的 key
      GATEWAY_KEY: ""
      # 可选：面板登录口令 —— 设置后面板需密钥登录（7 天会话），数据面 /v1/* 不受影响；
      # 留空 = 面板免登录（仅建议本机/内网使用）。公网部署务必设置！
      # PANEL_KEY: "change-me-to-a-long-secret"
      # 上游与模型（一般不用改）
      ZCODE_UPSTREAM_ORIGIN: "https://zcode.z.ai"
      ZCODE_MODEL: "GLM-5.3-Flash"
      # 调度参数可用环境变量覆盖（不设则用 data/pool-settings.json 或内置默认）
      # ZCGW_TOPN: "3"
      # ZCGW_MAX_INFLIGHT: "5"
    volumes:
      - ./data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-zcode2api}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 轻量加固
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: nickfedor/watchtower:1.23.2
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "${COMPOSE_PROJECT_NAME:-zcode2api}"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-600}"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-zcode2api}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
