# zcgw — ZCode 多账号反代网关
#
#   docker compose up -d          # 启动网关和 Watchtower（首次自动建目录）
#   docker compose logs -f        # 跟日志
#   docker compose down           # 停止（数据保留）
#   docker compose logs -f watchtower  # 查看自动更新日志
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build  # 源码构建
#
# 数据全部落在 ./data/（宿主机可备份）：
#   zcode.sqlite（账号 / 密钥 / 调度 / 安全 / 授权流 / 用量）  auto-claim.json
#
# 首次部署：把旧版的 accounts.json / keys.json 等放到 ./data/ 再 up，会自动导入并改名 .bak；
# 也可以直接启动后用面板添加。

services:
  zcgw:
    image: "${ZCGW_IMAGE:-ghcr.io/azurekiln2333/zcode2api:latest}"
    container_name: zcgw
    restart: unless-stopped
    ports:
      - "127.0.0.1:12283:12283"   # 只本机 nginx 反代；统一部署由平台面板访问
    environment:
      # 面板管理密钥：登录控制台，也是平台面板调用本服务管理接口的 bearer。
      # 至少 12 位；不设置且未启用 SSO 时面板免登录（仅建议本机/内网）。
      PANEL_ADMIN_KEY: "${PANEL_ADMIN_KEY:-}"
      # 单独域名部署时填写浏览器实际访问的地址，SSO 回调地址由它推导。
      PANEL_PUBLIC_URL: "${ZCODE_PUBLIC_URL:-}"
      # 监听端口；镜像默认 12283，这里显式固定一次，改映射时一并修改。
      PORT: "12283"
      # 调度参数可用环境变量覆盖（不设则用 data/pool-settings.json 或内置默认）
      # ZCGW_TOPN: "3"
      # ZCGW_MAX_INFLIGHT: "5"
    volumes:
      - ./data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-zcode2api}"
    # 健康检查由镜像自带（HEALTHCHECK 按 PORT 探测 /health），这里不再重复声明
    # 轻量加固
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: nickfedor/watchtower:1.23.2
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "${COMPOSE_PROJECT_NAME:-zcode2api}"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-600}"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-zcode2api}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
